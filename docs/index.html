<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guohe Hosts - Open Source Hosts Editor</title>
  <meta name="description" content="A modern, open-source cross-platform hosts file editor. Built with Tauri 2 + Vue 3.">
  <meta name="keywords" content="hosts editor, SwitchHosts, hosts file, DNS, Windows, macOS, Linux, Tauri, open source, cross-platform">
  <link rel="icon" type="image/png" href="ghhost.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #165dff;
      --primary-light: #4080ff;
      --primary-bg: rgba(22,93,255,0.06);
      --primary-border: rgba(22,93,255,0.15);
      --bg: #ffffff;
      --bg-secondary: #f7f8fa;
      --bg-tertiary: #f2f3f5;
      --bg-card: #ffffff;
      --text: #1d2129;
      --text-secondary: #4e5969;
      --text-tertiary: #86909c;
      --border: #e5e6eb;
      --border-light: #f0f0f0;
      --green: #00b42a;
      --orange: #ff7d00;
      --purple: #722ed1;
      --red: #f53f3f;
      --cyan: #14c9c9;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow: 0 4px 16px rgba(0,0,0,0.06);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
      --shadow-xl: 0 16px 48px rgba(0,0,0,0.1);
      --radius: 12px;
      --radius-lg: 16px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--primary); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--primary-light); }

    .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up {
      opacity: 0; transform: translateY(24px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-up.visible {
      opacity: 1; transform: translateY(0);
    }

    /* ===== NAV ===== */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .nav.scrolled {
      border-bottom-color: var(--border);
      box-shadow: 0 1px 8px rgba(0,0,0,0.04);
    }
    .nav-inner {
      max-width: 1120px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 56px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 17px; font-weight: 700; color: var(--text);
    }
    .nav-logo {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800;
    }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .nav-right a {
      color: var(--text-secondary); font-size: 14px; font-weight: 500;
      transition: color 0.2s;
    }
    .nav-right a:hover { color: var(--primary); }
    .nav-github {
      display: flex; align-items: center; gap: 6px;
    }
    .lang-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 14px; border-radius: 6px;
      background: transparent; border: 1px solid var(--border);
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; transition: all 0.2s;
      font-family: inherit;
    }
    .lang-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* ===== HERO ===== */
    .hero {
      padding: 130px 24px 64px;
      text-align: center;
      position: relative;
    }
    .hero::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg-secondary);
      clip-path: ellipse(75% 100% at 50% 0%);
      z-index: -1;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 16px; border-radius: 20px;
      background: var(--primary-bg); border: 1px solid var(--primary-border);
      color: var(--primary); font-size: 13px; font-weight: 600;
      margin-bottom: 28px;
    }
    .hero h1 {
      font-size: clamp(34px, 5.5vw, 52px);
      font-weight: 800; line-height: 1.2;
      letter-spacing: -0.03em; margin-bottom: 20px;
      color: var(--text);
    }
    .hero h1 .highlight { color: var(--primary); }
    .hero-desc {
      font-size: 17px; color: var(--text-secondary);
      max-width: 520px; margin: 0 auto 36px; line-height: 1.75;
    }
    .hero-actions {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 24px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 600; cursor: pointer;
      border: none; transition: all 0.2s; font-family: inherit;
    }
    .btn-primary {
      background: var(--primary); color: #fff;
      box-shadow: 0 2px 8px rgba(22,93,255,0.25);
    }
    .btn-primary:hover {
      background: var(--primary-light); color: #fff;
      box-shadow: 0 4px 16px rgba(22,93,255,0.35);
      transform: translateY(-1px);
    }
    .btn-outline {
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover {
      border-color: var(--primary); color: var(--primary);
      transform: translateY(-1px);
    }

    /* Platforms */
    .platforms {
      display: flex; align-items: center; justify-content: center; gap: 24px;
      color: var(--text-tertiary); font-size: 13px;
    }
    .platform-item {
      display: flex; align-items: center; gap: 6px;
    }
    .platform-item svg { opacity: 0.5; }

    /* ===== SCREENSHOT ===== */
    .screenshot-section { padding: 48px 24px 80px; }
    .screenshot-wrapper {
      max-width: 880px; margin: 0 auto;
      border-radius: var(--radius-lg); overflow: hidden;
      box-shadow: var(--shadow-xl);
      border: 1px solid var(--border);
      background: var(--bg-tertiary);
      position: relative;
    }
    .screenshot-wrapper img {
      width: 100%; height: auto; display: block;
    }
    .screenshot-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 16px; border-radius: 6px;
      background: transparent; border: 1px solid var(--border);
      font-size: 13px; font-weight: 500; color: var(--text-secondary);
      cursor: pointer; transition: all 0.2s; font-family: inherit;
    }
    .screenshot-toggle:hover { border-color: var(--primary); color: var(--primary); }
    .screenshot-toggle.active {
      background: var(--primary-bg); border-color: var(--primary);
      color: var(--primary); font-weight: 600;
    }

    /* ===== FEATURES ===== */
    .features { padding: 80px 24px; }
    .section-header { text-align: center; margin-bottom: 56px; }
    .section-label {
      display: inline-block; font-size: 13px; font-weight: 600;
      color: var(--primary); text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 12px;
    }
    .section-header h2 {
      font-size: 30px; font-weight: 700; margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .section-header p {
      font-size: 16px; color: var(--text-secondary);
      max-width: 460px; margin: 0 auto;
    }
    .features-grid {
      max-width: 1120px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .feature-card {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 28px 24px; border: 1px solid var(--border-light);
      transition: all 0.3s ease;
      position: relative;
    }
    .feature-card:hover {
      box-shadow: var(--shadow);
      border-color: var(--border);
      transform: translateY(-3px);
    }
    .feature-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .feature-card h3 {
      font-size: 15px; font-weight: 650; margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .feature-card p {
      font-size: 13.5px; color: var(--text-secondary); line-height: 1.65;
    }

    .fi-blue { background: rgba(22,93,255,0.07); color: var(--primary); }
    .fi-purple { background: rgba(114,46,209,0.07); color: var(--purple); }
    .fi-green { background: rgba(0,180,42,0.07); color: var(--green); }
    .fi-orange { background: rgba(255,125,0,0.07); color: var(--orange); }
    .fi-red { background: rgba(245,63,63,0.07); color: var(--red); }
    .fi-cyan { background: rgba(20,201,201,0.07); color: var(--cyan); }

    /* ===== TECH ===== */
    .tech {
      padding: 80px 24px;
      background: var(--bg-secondary);
    }
    .tech-grid {
      max-width: 700px; margin: 0 auto;
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    }
    .tech-tag {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px; border-radius: var(--radius-sm);
      background: var(--bg); border: 1px solid var(--border-light);
      font-size: 14px; font-weight: 500; color: var(--text);
      transition: all 0.2s;
      box-shadow: var(--shadow-sm);
    }
    .tech-tag:hover {
      border-color: var(--primary-border);
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .tech-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }

    /* ===== CTA ===== */
    .cta {
      padding: 72px 24px;
      text-align: center;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-light);
    }
    .cta h2 {
      font-size: 24px; font-weight: 700; margin-bottom: 10px;
      letter-spacing: -0.02em; color: var(--text);
    }
    .cta p {
      font-size: 15px; color: var(--text-secondary); margin-bottom: 24px;
    }
    .cta .btn-primary {
      background: var(--text); color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .cta .btn-primary:hover {
      background: var(--text-secondary);
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      transform: translateY(-1px);
    }

    /* ===== FOOTER ===== */
    .footer {
      padding: 28px 24px;
      text-align: center; font-size: 13px; color: var(--text-tertiary);
      border-top: 1px solid var(--border-light);
    }
    .footer-links {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; flex-wrap: wrap;
    }
    .footer a { color: var(--text-tertiary); }
    .footer a:hover { color: var(--primary); }
    .footer-sep { color: var(--border); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 860px) {
      .features-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .nav-right a.hide-mobile { display: none; }
      .hero { padding: 120px 20px 48px; }
      .hero h1 { font-size: 30px; }
      .hero-desc { font-size: 15px; }
      .platforms { gap: 16px; font-size: 12px; }
      .features, .tech, .cta { padding: 60px 20px; }
      .features-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

var currentLang = 'zh-CN';

function detectLang() {
  var saved = localStorage.getItem('guohe-lang');
  if (saved && i18n[saved]) return saved;
  var nav = navigator.language || navigator.userLanguage || '';
  return nav.startsWith('zh') ? 'zh-CN' : 'en-US';
}

function applyLang(lang) {
  currentLang = lang;
  localStorage.setItem('guohe-lang', lang);
  document.documentElement.lang = lang === 'zh-CN' ? 'zh-CN' : 'en';
  var strings = i18n[lang];

  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (strings[key] != null) el.textContent = strings[key];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el) {
    var key = el.getAttribute('data-i18n-html');
    if (strings[key] != null) el.innerHTML = strings[key];
  });

  // Elements with HTML entities
  ['hero.badge'].forEach(function(key) {
    var el = document.querySelector('[data-i18n="' + key + '"]');
    if (el && strings[key]) el.innerHTML = strings[key];
  });

  document.getElementById('langLabel').textContent = strings['lang.label'];
}

function toggleLang() {
  applyLang(currentLang === 'zh-CN' ? 'en-US' : 'zh-CN');
}

// Nav scroll effect
window.addEventListener('scroll', function() {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 10);
});

// Scroll reveal animation
var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

document.querySelectorAll('.fade-up').forEach(function(el) {
  observer.observe(el);
});

// Init
applyLang(detectLang());

// Screenshot toggle
function switchScreenshot(mode) {
  document.getElementById('screenshotImg').src = 'software-' + mode + '.png';
  document.getElementById('btnLight').classList.toggle('active', mode === 'light');
  document.getElementById('btnDark').classList.toggle('active', mode === 'dark');
}
</script>
